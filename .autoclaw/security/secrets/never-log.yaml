# Patterns that must never reach a log, a trace, an exception payload, or
# telemetry. Consumed by observability/redaction.yaml and applied *before* a
# record is written, not after it is read.
#
# A pattern that matches is replaced with `[REDACTED:{name}]` in logs and
# dropped entirely from telemetry. Exceptions are wrapped, not string-matched,
# because a secret in an exception usually arrives through a message that
# sanitising the message would not reach.

patterns:
  - name: byok-credential
    regex: "byok:[a-z0-9-]+:[a-zA-Z0-9]{8,}"

  - name: bearer-token
    regex: "Bearer\\s+[A-Za-z0-9._-]+"

  - name: api-key-generic
    regex: "(sk-|pk-|ghp_|gho_)[A-Za-z0-9]{20,}"

  - name: evm-private-key
    regex: "0x[a-fA-F0-9]{64}"

  - name: db-connection
    regex: "postgres(ql)?://[^\\s]+"

  - name: jwt
    regex: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"

  - name: aws-access-key
    regex: "(AKIA|ASIA)[0-9A-Z]{16}"

  - name: generic-assignment
    # A field literally named like a secret, whatever follows the separator.
    # Deliberately broad: this is the last pattern before the value reaches a
    # sink, and a false positive costs a `[REDACTED]` marker.
    regex: "(?i)\\b(api[_-]?key|secret|password|passwd|token|private[_-]?key|client[_-]?secret)\\b\\s*[:=]\\s*\\S+"

action:
  log: "[REDACTED:{name}]"
  telemetry: drop
  exception: wrap-as-SecretLeakPrevented

on_detection:
  emit_event: security.secret-leak-prevented
  include_field_name: true
  include_value: false
  severity: high
  # A detection is a signal, not just a substitution. Match rate is tracked;
  # a sudden change in it usually means a new code path started logging.
  alert_threshold: 5 per minute per tenant

# What is deliberately NOT here: evidence content, product data, certificate
# numbers. Those are not secrets, and redacting them would make the logs
# useless for the audit they exist to support. Field-level redaction for
# evidence is handled per rule via `audit.redact`.
