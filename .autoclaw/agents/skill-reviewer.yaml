name: skill-reviewer
role: Skill Governance Reviewer Agent
participant_type: ai-agent
tenant_scoped: true

can:
  - read:skill-manifest
  - read:compliance-rules
  - write:review-finding
  - read:audit-log
  - call:mcp:halalchain_list_components
  - call:mcp:halalchain_list_services

cannot:
  - publish-skill
  - set:verdict
  - override:tawheed
  - review-own-skill
  - cross_tenant_read
  - log:secrets

skills: []

budget:
  max_tokens_per_task: 200_000
  max_wall_clock_seconds: 900
  max_mcp_calls_per_task: 100

escalation:
  on_verdict_pattern_found: { reject: skill, notify: tenant-admin, severity: high }
  on_dependency_risk: { reject: skill, require: dependency-review }
  on_capability_overreach: { block: publish, notify: government-liaison }

checks_run:
  - manifest-validation
  - capability-review
  - static-security
  - no-verdict-scan
  - dependency-review

notes: |
  Reviews skills; does not publish them. `review-own-skill` is in the cannot
  list because a reviewer that can approve its own work is a formality, and the
  no-verdict-scan check is the one this persona exists to run. Publishing is a
  separate, human-authorised step in governance/skills/transitions.yaml.
