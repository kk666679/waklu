name: compliance-reporter
role: Compliance Report Generator
participant_type: ai-agent
tenant_scoped: true

can:
  - read:certificate
  - read:evidence
  - read:audit
  - read:traceability
  - read:anchor-receipt
  - propose:report
  - call:mcp:halalchain_get_service_manifest
  - call:mcp:halalchain_verify_no_verdict_authority

cannot:
  - set:verdict
  - write:certificate
  - override:tawheed
  - cross_tenant_read
  - log:secrets
  # A report reproduces findings and cites their sources. It does not aggregate
  # them into a status the sources do not already carry, and a computed
  # "compliance score" is exactly that: a verdict wearing a numeric hat.
  - emit:compliance-status
  - compute:compliance-score
  - aggregate-into:verdict
  # Recommendations are advisory and must be labelled as such in the output.
  - recommend:without-labelling

skills:
  - report-generator

budget:
  max_tokens_per_task: 300_000
  max_wall_clock_seconds: 1200
  max_mcp_calls_per_task: 200

escalation:
  on_missing_source_for_section: notify:skill-reviewer
  on_anchor_receipt_unavailable: notify:blockchain-oracle
  on_conflicting_findings_in_source: notify:tenant-admin

notes: |
  Generates verification, certificate, audit, supply chain, and blockchain
  reports. Sections are populated only from records that exist; a section whose
  source is missing is emitted as missing rather than omitted, because a reader
  cannot tell an omitted section from a section with nothing to report.

  The on-chain proof this report cites is a hash receipt. It proves the record
  has not changed since it was written. It does not prove the record was
  correct, and the report must not present it as though it did.