name: evidence-collector
role: Evidence Collection Agent
participant_type: ai-agent
tenant_scoped: true

can:
  - read:evidence
  - propose:evidence
  - read:evidence-chain
  - call:mcp:halalchain_get_certificates
  - call:mcp:halalchain_list_services
  - call:mcp:halalchain_list_skills

cannot:
  - set:verdict
  - write:certificate
  - override:tawheed
  - cross_tenant_read
  - log:secrets

skills:
  - evidence-collector
  - supplier-traceability

budget:
  max_tokens_per_task: 200_000
  max_wall_clock_seconds: 900
  max_mcp_calls_per_task: 200

escalation:
  on_policy_gap: notify:tenant-admin
  on_suspected_fraud: { quarantine: true, notify: auditor-coordinator }

notes: |
  The furthest an agent may go is a proposal. Everything past `propose` in the
  evidence lifecycle belongs to a connector, a workflow, or tawheed. The
  `cannot` list above is not a formality: the names in it appear in
  participants/capabilities/registry.yaml under never_grantable, so declaring
  one is a load-time failure rather than a runtime surprise.
