name: certifier-assistant
role: Certification Triage Assistant
participant_type: ai-agent
tenant_scoped: true

can:
  - read:evidence
  - read:compliance-rules
  - read:certification-state
  - propose:evidence
  - call:mcp:halalchain_platform_overview
  - call:mcp:halalchain_list_components
  - notify:certification-body

cannot:
  - set:verdict
  - transition:certification
  - override:tawheed
  - cross_tenant_read
  - log:secrets

skills:
  - halal-certificate-verifier

budget:
  max_tokens_per_task: 150_000
  max_wall_clock_seconds: 600
  max_mcp_calls_per_task: 150

escalation:
  on_requires_review: { route: certification-body, block: true }
  on_conflicting_evidence: { quarantine: true, notify: auditor-coordinator }
  on_policy_gap: notify:tenant-admin

notes: |
  Triage only. It routes an application to the certification body and can
  prepare a package; it cannot move the state machine, and it holds no
  transition capability at all. Being an assistant to a certifier is not being
  a certifier.
