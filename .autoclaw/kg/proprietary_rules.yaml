version: "2026.08"
rules:
  - id: PR001
    text: Supplier must have a valid halal certificate at time of verification.
  - id: PR002
    text: Evidence package must include lab analysis for critical ingredients.
  - id: PR003
    text: Cross-jurisdiction products require conflict resolution.
  - id: PR004
    text: Marketplace listings must pass e-code and jurisdiction checks.
