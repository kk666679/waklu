name: batch-processor
version: 2.0.0
description: Orchestrator for bulk product processing

agents:
  - halal-orchestrator

workflows:
  - name: process_batch
    description: Process a batch of products
    steps:
      - id: load_batch
        description: Load batch of products
        action: load_jsonl
        input: products.jsonl
        
      - id: process_parallel
        description: Process products in parallel
        action: parallel_map
        agent: halal-orchestrator
        workflow: verify_product
        max_workers: 10
        
      - id: collect_results
        description: Collect all results
        action: collect
        output: batch_results
        
      - id: generate_summary
        description: Generate batch summary
        action: summarize
        input: batch_results
        output: batch_summary

parallel_execution: true
max_parallel_steps: 10

retry:
  max_attempts: 3
  backoff: exponential

timeout:
  per_step: 60s
  workflow: 600s

audit:
  enabled: true
  log_level: summary

output:
  format: jsonl
  path: verdicts.jsonl
