name: halal-orchestrator
version: 2.0.0
description: Orchestrates multiple agents for complete halal verification

agents:
  - ingredient-analyzer
  - certificate-validator
  - supply-chain-tracker
  - halal-assistant
  - policy-engine

workflows:
  - name: verify_product
    description: Complete product verification workflow
    steps:
      - id: validate_input
        description: Validate input data structure
        action: validate_schema
        schema: product_schema.yaml
        
      - id: analyze_ingredients
        description: Analyze product ingredients
        agent: ingredient-analyzer
        input: product.ingredients
        output: ingredient_analysis
        
      - id: validate_certificate
        description: Validate halal certificate
        agent: certificate-validator
        input: product.certificate
        output: certificate_status
        
      - id: track_supply_chain
        description: Track supply chain
        agent: supply-chain-tracker
        input: product.supplier
        output: supply_chain_status
        
      - id: collect_evidence
        description: Collect all evidence
        agent: halal-assistant
        input: 
          - ingredient_analysis
          - certificate_status
          - supply_chain_status
        output: evidence_collection
        
      - id: render_verdict
        description: Render final verdict
        agent: policy-engine
        input: evidence_collection
        output: final_verdict

parallel_execution: true
max_parallel_steps: 4

consensus:
  required: false
  threshold: 3
  timeout: 60s

retry:
  max_attempts: 3
  backoff: exponential
  initial_delay: 1s
  max_delay: 30s

timeout:
  per_step: 30s
  workflow: 120s

audit:
  enabled: true
  log_level: detailed
  output_format: json
  storage: .autoclaw/orchestrator/audit_logs/

security:
  input_validation: true
  output_validation: true
  encryption: true
  access_control: true

output:
  format: structured
  schema:
    workflow_id: string
    product_id: string
    status: string
    evidence: object
    verdict: string
    audit_trail: object
    timestamp: string
