name: episodic-memory
version: 2.0.0
memory_type: episodic
capacity:
  max_episodes: 10000
  max_episode_size_kb: 100
  max_summaries: 1000
storage:
  database: .autoclaw/memory/agent_memory.db
  summary_path: .autoclaw/memory/episodic/summaries/
  timeline_index: true
summarization:
  enabled: true
  interval: 100
  max_summary_length: 500
  model: local
  preserve_events: true
timeline:
  enabled: true
  compress_interval: 3600
  max_events_per_hour: 100
retrieval:
  temporal_search: true
  context_window: 5
  relevance_weight: 0.5
security:
  encryption: true
  access_level: level_3
  audit: true
