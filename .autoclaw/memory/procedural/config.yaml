name: procedural-memory
version: 2.0.0
memory_type: procedural
storage:
  cache_path: .autoclaw/memory/procedural/skills_cache/
  max_cached_skills: 100
  skill_database: .autoclaw/memory/agent_memory.db
learning:
  enabled: true
  pattern_recognition: true
  skill_optimization: true
  parameters:
    learning_rate: 0.01
    discount_factor: 0.9
    exploration_rate: 0.1
  feedback_loop:
    enabled: true
    window_size: 100
    improvement_threshold: 0.1
retrieval:
  skill_matching: true
  parameter_inference: true
  fallback_skills: true
security:
  encryption: true
  access_level: level_2
  audit: true
  versioning: true
