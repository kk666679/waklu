name: long-term-memory
version: 2.0.0
memory_type: long_term
capacity:
  max_entries: 1000000
  max_tokens_per_entry: 5000
  max_attachments: 10
  max_total_size_gb: 10
retention:
  ttl: 31536000
  max_ttl: 315360000
  permanent: true
  decay:
    enabled: true
    half_life: 31536000
    importance_factor: 0.5
storage:
  type: persistent
  database: .autoclaw/memory/agent_memory.db
  vector_store: .autoclaw/vector/embeddings.db
  archive_path: .autoclaw/memory/long_term/archives/
  backup_interval: 86400
indexing:
  enabled: true
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dimensions: 384
  batch_size: 32
  index_type: hnsw
  index_parameters:
    m: 16
    ef_construction: 200
    ef_search: 100
  reindex_interval: 604800
deduplication:
  enabled: true
  threshold: 0.95
  strategy: merge
  merge_rules:
    - keep_highest_confidence
    - merge_sources
    - latest_timestamp
search:
  default_limit: 10
  max_limit: 100
  min_similarity: 0.7
  hybrid_search: true
  re_rank: true
security:
  encryption: true
  access_level: level_3
  audit: true
  immutable: false
  versioning: true
monitoring:
  enabled: true
  metrics: [size, hit_rate, miss_rate, vector_search_latency, consolidation_rate]
