version: "2026.08"
tiers:
  short_term:
    provider: redis
    ttl_seconds: 3600
  episodic:
    provider: postgres
    table: episodic_memory
  semantic:
    provider: qdrant
    collection: semantic_memory
  procedural:
    provider: postgres
    table: procedural_memory
  long_term:
    provider: qdrant
    collection: long_term_memory
consolidation:
  enabled: true
  schedule: "0 3 * * *"
