id: certificate-validator
name: Certificate Validator
runtime: python
module: skills.implementations.certificate_validator:CertificateValidator
description: Validates halal certificates against issuer registry and jurisdiction rules.
inputs:
  certificateId: string
  issuer: string
  jurisdiction: string
outputs:
  valid: boolean
  issues: list
  confidence: float
reference:
  - reference/certificate_authorities/
  - reference/jurisdictions/
eval:
  suite: eval/skills/certificate-validator.eval.yaml
