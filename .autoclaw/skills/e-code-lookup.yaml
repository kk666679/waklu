name: e-code-lookup
version: 2.0.0
description: Looks up halal status of E-codes and additives
type: sync
timeout: 3s

input:
  schema:
    type: object
    properties:
      e_code:
        type: string
        description: E-code (e.g., E471, E322)
        required: true
      format:
        type: string
        description: Format of the E-code
        enum: [numeric, alpha, full]
        default: alpha
      include_references:
        type: boolean
        default: false
      include_sources:
        type: boolean
        default: true

output:
  schema:
    type: object
    properties:
      e_code:
        type: string
      name:
        type: string
      status:
        type: string
        enum: [HALAL, HARAM, MASHBOOH, UNKNOWN]
      confidence:
        type: number
        minimum: 0
        maximum: 1
      source:
        type: string
        description: Source of the ingredient
      notes:
        type: string
      references:
        type: array
        items:
          type: string
      alternative_names:
        type: array
        items:
          type: string
      category:
        type: string
        description: Functional category
      jurisdiction_notes:
        type: object
        additionalProperties:
          type: string
      last_updated:
        type: string
        format: date
      similar_codes:
        type: array
        items:
          type: string

execution:
  provider: python
  source: skills/implementations/e_code_lookup.py
  entrypoint: lookup_e_code
  
  dependencies:
    - yaml
    - re

knowledge_sources:
  - .autoclaw/kg/halal_e_codes.yaml
  - .autoclaw/kg/ingredient_db.yaml

security:
  required_permissions: [kg:read]
  data_classification: level_1
  input_sanitization: true
  output_sanitization: true

caching:
  enabled: true
  ttl: 86400
  max_entries: 5000
