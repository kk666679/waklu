version: 1
events:
  - name: CertificateIssued
    contract: CertificateRegistry
    fields: [certificateId, issuer, validFrom, validTo]
  - name: CertificateRevoked
    contract: CertificateRegistry
    fields: [certificateId, reason]
  - name: CertificateRenewed
    contract: CertificateRegistry
    fields: [certificateId, newValidTo]
