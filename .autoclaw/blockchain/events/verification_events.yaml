version: 2.0.0
description: Verification event definitions

events:
  VerificationRecorded:
    description: Emitted when a verification is recorded
    contract: HalalVerification
    parameters:
      - name: verificationId
        type: bytes32
        indexed: true
      - name: productId
        type: bytes32
        indexed: true
      - name: verdict
        type: uint8
        indexed: false
      - name: verifier
        type: address
        indexed: false
      - name: timestamp
        type: uint256
        indexed: false
    handlers:
      - blockchain-orchestrator
      - alert-monitor

  VerificationVerified:
    description: Emitted when a verification is verified
    contract: HalalVerification
    parameters:
      - name: verificationId
        type: bytes32
        indexed: true
      - name: productId
        type: bytes32
        indexed: true
      - name: verifier
        type: address
        indexed: false
    handlers:
      - verification-verifier
      - compliance-reporter

  VerificationStatusChanged:
    description: Emitted when verification status changes
    contract: HalalVerification
    parameters:
      - name: verificationId
        type: bytes32
        indexed: true
      - name: status
        type: uint8
        indexed: false
      - name: updatedBy
        type: address
        indexed: false
    handlers:
      - alert-monitor
      - compliance-auditor
