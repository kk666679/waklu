[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-shared"
version = "0.1.0"
description = "Cross-service Python helpers for HalalChain (AI_BACKEND normalization, shared cache)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["halalchain_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
