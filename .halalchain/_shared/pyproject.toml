[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-shared"
version = "0.1.0"
description = "Cross-service Python helpers for HalalChain (AI_BACKEND normalization, shared cache)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.120.0",
    "uvicorn[standard]==0.40.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "httpx==0.28.0",
    "structlog==25.1.0",
    "python-dotenv>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
llm = [
    "openai==3.22.1",
]
base = [
    "fastapi==0.120.0",
    "uvicorn[standard]==0.40.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "httpx==0.28.0",
    "structlog==25.1.0",
    "python-dotenv>=1.1.1,<2.0.0",
]
skills = [
    "agent-skills==1.1.1",
    "haiku-skills[signing]==0.18.1",
]
mcp = [
    "mcp==2.2.0",
    "mcp-types==2.2.0",
]
mcp-cli = [
    "mcp[cli]==2.2.0",
]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.9.0",
    "mypy==1.15.0",
    "coverage[toml]==7.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["halalchain_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }