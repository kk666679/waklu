[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-local-models"
version = "0.1.0"
description = "Local model inference service for HalalChain (embeddings, classification, rerank)"
requires-python = ">=3.11"
dependencies = [
    "halalchain-shared",
]

[project.optional-dependencies]
inference = [
    "transformers>=5.13,<6.0.0",
    "torch>=2.8,<3.0.0",
    "accelerate>=1.0,<2.0.0",
    "safetensors>=0.5,<1.0.0",
    "tokenizers>=0.21,<1.0.0",
    "huggingface-hub>=1.5,<2.0.0",
]
quantization = [
    "bitsandbytes>=0.50,<1.0.0",
    # 0.8.x was never published; the resolver only finds <=0.7.1, which is what
    # the previous ">=0.8,<1.0" range was silently excluding. Resolves to 0.7.1.
    "auto-gptq>=0.7,<1.0.0",
]
gguf = [
    "llama-cpp-python>=0.3,<0.4.0",
]
optimized = [
    # UNRESOLVABLE against this project as pinned: vllm>=0.30 requires
    # starlette>=1.0.1, while halalchain-shared pins fastapi==0.120.0, which caps
    # starlette below 0.49. Only vllm 0.11.x resolves, which is far below the
    # intended floor. This extra is therefore excluded from the image lock and
    # the container build. Making it installable needs either a fastapi/starlette
    # upgrade across all services or an agreed vllm downgrade - both are
    # dependency-policy decisions, not CI fixes.
    "vllm>=0.30,<1.0.0",
]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.9.0",
    "mypy==1.15.0",
    "coverage[toml]==7.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["halalchain_local_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }

[tool.uv.sources]
# halalchain-shared lives in this repo, not on PyPI, so every member that depends
# on it must declare where to find it. A relative path source works regardless of
# uv's workspace discovery; without it `uv pip compile` fails with
# "halalchain-shared was not found in the package registry".
# The emitted lock omits this package (--no-emit-package) because pip cannot
# hash-check a local requirement; its dependencies stay pinned in the output.
halalchain-shared = { path = "../_shared" }