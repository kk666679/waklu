[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-local-models"
version = "0.1.0"
description = "Local model inference service for HalalChain (embeddings, classification, rerank)"
requires-python = ">=3.11"
dependencies = [
    "halalchain-shared",
]

[project.optional-dependencies]
inference = [
    "transformers>=5.13,<6.0.0",
    "torch>=2.8,<3.0.0",
    "accelerate>=1.0,<2.0.0",
    "safetensors>=0.5,<1.0.0",
    "tokenizers>=0.21,<1.0.0",
    "huggingface-hub>=1.5,<2.0.0",
]
quantization = [
    "bitsandbytes>=0.50,<1.0.0",
    "auto-gptq>=0.8,<1.0.0",
]
gguf = [
    "llama-cpp-python>=0.3,<0.4.0",
]
optimized = [
    "vllm>=0.30,<1.0.0",
]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.9.0",
    "mypy==1.15.0",
    "coverage[toml]==7.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["halalchain_local_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }