[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-ai-inference"
version = "0.2.0"
description = "AI inference gateway for HalalChain"
requires-python = ">=3.11"
dependencies = [
    "halalchain-shared[llm]",
    "python-multipart==0.0.32",
    "anthropic==1.11.0",
    "qdrant-client",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "markdown==3.11",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "python-json-logger==4.2.0",
    "prometheus-fastapi-instrumentator==7.1.0",
]
[tool.setuptools.packages.find]
where = ["src", "../_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }
