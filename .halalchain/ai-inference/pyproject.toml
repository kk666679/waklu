[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halalchain-ai-inference"
version = "0.2.0"
description = "AI inference gateway for HalalChain"
requires-python = ">=3.11"
dependencies = [
    "halalchain-shared",
]

[project.optional-dependencies]
llm = [
    "openai==1.99.9",
    "anthropic==0.45.0",
]
vector = [
    "qdrant-client==1.15.0",
]
doc-processing = [
    "pypdf==6.1.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.13.4",
    "lxml==6.0.0",
    "markdown==3.8",
]
auth = [
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
]
observability = [
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "python-json-logger==4.0.0",
    "prometheus-fastapi-instrumentator==7.0.0",
]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.9.0",
    "mypy==1.15.0",
    "coverage[toml]==7.10.0",
]

[tool.setuptools.packages.find]
where = ["src", "../_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }

[tool.uv.sources]
# halalchain-shared lives in this repo, not on PyPI, so every member that depends
# on it must declare where to find it. A relative path source works regardless of
# uv's workspace discovery; without it `uv pip compile` fails with
# "halalchain-shared was not found in the package registry".
# The emitted lock omits this package (--no-emit-package) because pip cannot
# hash-check a local requirement; its dependencies stay pinned in the output.
halalchain-shared = { path = "../_shared" }