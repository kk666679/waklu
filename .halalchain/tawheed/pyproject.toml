[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tawheed"
version = "1.0.0"
description = "Evidence-driven multi-agent halal verification service"
requires-python = ">=3.11"
dependencies = [
    "halalchain-shared",
]

[project.optional-dependencies]
llm = [
    "halalchain-shared[llm]",
]
observability = [
    # src/observability.py imports these at module scope and src/main.py imports
    # that module unconditionally, so they are required to boot the service, not
    # an optional add-on. Keep in step with ai-inference's observability extra.
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "python-json-logger==4.2.0",
]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.9.0",
    "mypy==1.15.0",
    "coverage[toml]==7.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer-package = { mcp = false, "mcp-types" = false }
