[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tawheed"
version = "1.0.0"
description = "Evidence-driven multi-agent halal verification service"
requires-python = ">=3.11"
dependencies = [
  "halalchain-shared",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
