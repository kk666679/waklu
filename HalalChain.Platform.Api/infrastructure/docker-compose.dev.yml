services:
  # ── PostgreSQL (or use the local SQLite file at HalalChain.Platform.Api/halalchain.db) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: halalchain
      POSTGRES_PASSWORD: halalchain
      POSTGRES_DB: halalchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halalchain"]
      interval: 5s
      retries: 12

  # ── IPFS local node (kubo) — used by the API in dev ──
  ipfs:
    image: ipfs/kubo:v0.27.0
    environment:
      IPFS_PROFILE: server
    ports:
      - "5001:5001"  # RPC API (used by LocalKuboStorageService)
      - "8080:8080"  # Gateway (used to fetch CIDs back)
    volumes:
      - ipfsdata:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "diag", "sys"]
      interval: 10s
      retries: 6

  # ── Anvil (Polygon Amoy fork) — local chain for end-to-end testing ──
  # Runs a Polygon-forked local chain. Pre-funded accounts. Mine instantly.
  polygon-fork:
    image: ghcr.io/foundry-rs/foundry:nightly
    command: >
      sh -c "anvil
            --host 0.0.0.0
            --port 8545
            --chain-id 80002
            --balance 10000
            --gas-limit 30000000
            --block-time 1
            --accounts 20
            --mnemonic 'halalchain dev mnemonic do not use in production'
            --fork-url $${AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}"
    environment:
      - AMOY_RPC_URL=${AMOY_RPC_URL:-}
    ports:
      - "8545:8545"
    profiles: ["chain"]  # only start when --profile chain

volumes:
  pgdata:
  ipfsdata:
