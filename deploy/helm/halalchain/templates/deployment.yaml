{{/*
deployment.yaml — Standard (non-blue/green) Deployments for all five application services.

  • platform-api  — always rendered; carries track: stable for canary coexistence
  • web           — rendered only when blueGreen.enabled is false
  • marketplace   — rendered only when blueGreen.enabled is false
  • ai-inference  — always rendered
  • tawheed       — always rendered

When blueGreen.enabled=true, web and marketplace are handled by deployment-bluegreen.yaml.
*/}}

{{/* ─── platform-api ──────────────────────────────────────────────────────────── */}}
{{- include "halalchain.validateImageTag" .Values.platformApi.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform-api
  labels:
    {{- include "halalchain.labels" . | nindent 4 }}
    app: platform-api
spec:
  replicas: {{ .Values.platformApi.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: platform-api
      track: stable
  template:
    metadata:
      labels:
        app: platform-api
        track: stable
    spec:
      containers:
        - name: platform-api
          image: "{{ .Values.platformApi.image.repository }}:{{ .Values.platformApi.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.platformApi.port }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.platformApi.env.ASPNETCORE_ENVIRONMENT | quote }}
            - name: ASPNETCORE_URLS
              value: {{ .Values.platformApi.env.ASPNETCORE_URLS | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.platformApi.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.platformApi.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}

{{/* ─── web (halalchain) — skipped when blueGreen handles it ────────────────── */}}
{{- if not .Values.blueGreen.enabled }}
---
{{- include "halalchain.validateImageTag" .Values.web.image.tag }}
apiVersion: apps/v1
kind: Deployment
