{{/*
hpa.yaml — HorizontalPodAutoscaler for each service that opts in via
           <service>.autoscaling.enabled=true in values.yaml.

Each HPA:
  • uses autoscaling/v2 (stable since Kubernetes 1.23)
  • targets the matching Deployment by name
  • sources minReplicas, maxReplicas, and targetCPUUtilizationPercentage
    exclusively from values.yaml — no hard-coded values
*/}}

{{/* ─── platform-api ──────────────────────────────────────────────────────────── */}}
{{- if .Values.platformApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-platform-api
  labels:
    {{- include "halalchain.labels" . | nindent 4 }}
    app: platform-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-platform-api
  minReplicas: {{ .Values.platformApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.platformApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.platformApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

