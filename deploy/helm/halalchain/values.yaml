replicaCount: 2

# Default registry namespace. release.yml pushes to
# ${{ vars.GHCR_NAMESPACE || github.repository_owner }}, which may differ from
# this value; the deploy jobs override registry/namespace with --set so the
# running pods always match the images that were actually pushed.
#
# NOTE: repository below is a PLAIN string, not a template. Helm does not render
# values.yaml, so a {{ }} expression here would be emitted into the manifests
# verbatim. The templates join registry/namespace/repository via the
# "halalchain.image" helper instead.
image:
  pullPolicy: IfNotPresent
  registry: ghcr.io
  namespace: supporthalal

# platform-api (canary release)
platformApi:
  image:
    repository: halalchain-platform-api
    tag: "dev"
  replicaCount: 2
  port: 8080
  env:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  ingress:
    host: ""

# halalchain web UI (blue/green release)
web:
  image:
    repository: halalchain-web
    tag: "dev"
  replicaCount: 2
  port: 8080
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  ingress:
    host: ""

# marketplace (blue/green release)
marketplace:
  image:
    repository: halalchain-marketplace
    tag: "dev"
  replicaCount: 2
  port: 8080
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  ingress:
    host: ""

# ai-inference (standard deploy)
aiInference:
  image:
    repository: halalchain-ai-inference
    tag: "dev"
  replicaCount: 1
  port: 7071
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  ingress:
    host: ""

# tawheed policy engine (standard deploy)
tawheed:
  image:
    repository: halalchain-tawheed
    tag: "dev"
  replicaCount: 1
  port: 8000
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  ingress:
    host: ""

# Global ingress
ingress:
  enabled: false
  className: nginx
  annotations: {}

# Blue/green (halalchain + marketplace only)
blueGreen:
  enabled: false
  activeSlot: blue
  previewTag: "dev"

# Canary (platform-api only)
canary:
  enabled: false
  replicaCount: 1
  imageTag: "dev"

# Global resource defaults
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
