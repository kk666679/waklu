replicaCount: 2

image:
  repository: ghcr.io/supporthalal/halalchain
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

platformApi:
  image:
    repository: ghcr.io/supporthalal/halalchain-platform-api
    tag: "latest"
  port: 8080
  env:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080

web:
  image:
    repository: ghcr.io/supporthalal/halalchain-web
    tag: "latest"
  port: 8080

marketplace:
  image:
    repository: ghcr.io/supporthalal/halalchain-marketplace
    tag: "latest"
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  hosts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
