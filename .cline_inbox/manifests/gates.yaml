# Gate registry — authoritative. See ../README.md for the relationship to the
# root gates.yaml status mirror.
#
# automated: true  → gate-check.mjs can decide this
# automated: false → human judgement. The script reports PENDING, never PASS.
version: 1
last_updated: 2026-09-26

gates:
  - id: gate-001-002
    from: ENT-001
    to: ENT-002
    criteria_file: phases/ENT-001-specify/GATE-CRITERIA.md
    checks:
      - id: G1.2
        name: project-count
        automated: true
        description: Project count in .sln matches the 18 documented in AGENTS.md
      - id: G1.3
        name: adrs-have-dissent
        automated: true
        description: ADR-001..005 each contain a Dissent section
      - id: G1.8
        name: images-pinned
        automated: true
        description: No :latest or bare-major tags in compose or service manifest
      - id: G1.9
        name: evidence-index-seeded
        automated: true
        description: Evidence index has >= 9 entries, all with named owners
      - id: G1.1
        name: architecture-ratified
        automated: false
        description: Signed steering minutes exist
      - id: G1.4
        name: adr-006-ratified
        automated: false
        description: Chain network ADR signed by Steering
      - id: G1.5
        name: adr-007-ratified
        automated: false
        description: PSP ADR plus vendor confirmation letter
      - id: G1.6
        name: adr-008-ratified
        automated: false
        description: Registrar key custody ADR plus security review
      - id: G1.7
        name: adr-009-ratified
        automated: false
        description: Multi-tenancy ADR, or provisional with upgrade path
      - id: G1.10
        name: baseline-metrics
        automated: false
        description: Benefits baseline table filled in

  - id: gate-002-003
    from: ENT-002
    to: ENT-003
    criteria_file: phases/ENT-002-build/CHARTER.md
    checks:
      - id: G2.1
        name: solution-builds
        automated: true
        description: dotnet build succeeds in Release
      - id: G2.2
        name: architecture-tests-pass
        automated: true
        description: HalalChain.Architecture.Tests green
      - id: G2.3
        name: principles-hold
        automated: true
        description: P1..P6 invariants verified by hooks/principles.mjs
      - id: G2.4
        name: no-sha256-merkle
        automated: true
        description: Sha256MerkleTree does not exist anywhere in the repo
      - id: G2.5
        name: contracts-build
        automated: true
        description: forge build succeeds
      - id: G2.6
        name: contracts-test
        automated: true
        description: forge test passes
      - id: G2.7
        name: coverage-threshold
        automated: true
        description: Domain + Application line coverage >= 80%
      - id: G2.8
        name: slither-clean
        automated: true

  - id: gate-004-005
    from: ENT-004
    to: ENT-005
    criteria_file: phases/ENT-004-release/CHARTER.md
    checks:
      - id: G4.1
        name: error-budget-healthy
        automated: true
        description: Error budget remaining >= 90%
      - id: G4.2
        name: oncall-rotation-populated
        automated: true
        description: On-call rotation has no unstaffed weeks
      - id: G4.3
        name: postmortem-filed
        automated: true
        description: At least one postmortem exists
      - id: G4.4
        name: rollback-drill-passed
        automated: false
        description: Rollback executed within 15 minutes in a drill
      - id: G4.5
        name: runbooks-walked
        automated: false
        description: Every runbook walked by BAU on-call twice
      - id: G4.6
        name: bau-handover-signed
        automated: false
        description: SRE lead and product owner signed off

  - id: gate-005-006
    from: ENT-005
    to: ENT-006
    criteria_file: phases/ENT-005-scale/CHARTER.md
    checks:
      - id: G5.1
        name: tenant-isolation-tests-pass
        automated: true
        description: Isolation suite green at every tier
      - id: G5.2
        name: region-failover-drill
        automated: false
        description: Regional failover exercised end to end
      - id: G5.3
        name: cost-targets-met
        automated: true
        description: All five unit-cost targets achieved
      - id: G5.4
        name: residency-verified
        automated: false
        description: Per-tenant region pinning verified

  - id: gate-007-008
    from: ENT-007
    to: ENT-008
    criteria_file: phases/ENT-007-author/CHARTER.md
    checks:
      - id: G7.1
        name: no-verdict-node
        automated: true
        description: No verdict-emitting node in the palette
      - id: G7.2
        name: roundtrip-tests-pass
        automated: true
        description: React Flow JSON round-trips to the Python workflow format
      - id: G7.3
        name: proposals-schema-valid
        automated: true
        description: Every node output validates against EvidenceProposal
      - id: G7.4
        name: capabilities-declared
        automated: false
        description: Every node declares its tool capability on hover

  - id: gate-008-009
    from: ENT-008
    to: ENT-009
    criteria_file: phases/ENT-008-complete/CHARTER.md
    checks:
      - id: G8.1
        name: wcag-aa-audit
        automated: true
        description: WCAG 2.2 AA audit passed
      - id: G8.2
        name: handover-signed
        automated: true
        description: Handover sign-off present
      - id: G8.3
        name: layout-deterministic
        automated: true
        description: Same input graph yields identical layout
      - id: G8.4
        name: keyboard-only-authoring
        automated: false
        description: Full workflow authorable without a mouse

  - id: gate-009-final
    from: ENT-009
    to: null
    criteria_file: phases/ENT-009-close/CHARTER.md
    checks:
      - id: G9.1
        name: controls-automated-80pct
        automated: true
        description: >= 80% of controls emit automated evidence
      - id: G9.2
        name: benefits-tracked
        automated: true
        description: Benefits realization report is current
      - id: G9.3
        name: no-overdue-actions
        automated: true
        description: No postmortem action item past due

        description: No high or medium Slither findings
      - id: G2.9
        name: build-order-respected
        automated: false
        description: Constraints landed before the code they constrain

  - id: gate-003-004
    from: ENT-003
    to: ENT-004
    criteria_file: phases/ENT-003-certify/CHARTER.md
    checks:
      - id: G3.1
        name: no-open-critical-findings
        automated: true
        description: Zero critical/high findings in the pentest report
      - id: G3.2
        name: no-vulnerable-packages
        automated: true
        description: dotnet list package --vulnerable returns no high/critical
      - id: G3.3
        name: soc2-report-signed
        automated: true
        description: Signed SOC 2 Type II report present
      - id: G3.4
        name: iso27001-certificate
        automated: false
        description: ISO 27001:2022 certificate issued
      - id: G3.5
        name: registrar-key-kms-backed
        automated: true
        description: ADR-008 records KMS-backed custody for production
      - id: G3.6
        name: halal-body-endorsement
        automated: false
        description: Halal certification body endorsed the control design
