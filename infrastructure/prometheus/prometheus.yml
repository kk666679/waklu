global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ${CLUSTER_NAME}
    env: ${ENV}
    region: ${REGION}

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

remote_write:
  - url: http://otel-collector:4318/v1/metrics

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ['platform-api:8080']
        labels: { service: platform-api }

  - job_name: halalchain
    metrics_path: /metrics
    static_configs:
      - targets: ['halalchain:8080']
        labels: { service: halalchain }

  - job_name: marketplace
    metrics_path: /metrics
    static_configs:
      - targets: ['marketplace:8080']
        labels: { service: marketplace }

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets: ['mcp:8080']
        labels: { service: mcp }

  - job_name: tawheed
    metrics_path: /metrics
    static_configs:
      - targets: ['tawheed:8000']
        labels: { service: tawheed }

  - job_name: ai-inference
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-inference:7071']
        labels: { service: ai-inference }

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
