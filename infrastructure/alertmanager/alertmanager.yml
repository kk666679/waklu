# ── Secrets ──────────────────────────────────────────────────────────────────
# Alertmanager does NOT expand ${VAR} in its config file, so every secret is
# read from a file under /etc/alertmanager/secrets instead. Those files are
# written from the values in the repo-root .env by:
#
#     python3 infrastructure/scripts/write-alertmanager-secrets.py
#
# Run that before `docker compose -f infrastructure/docker-compose.observability.yml up`.
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  # Non-secret SMTP settings. No `*_file` variant exists for these fields, so
  # they are plain values — change them here if you use a different provider.
  smtp_smarthost: smtp.sendgrid.net:587
  smtp_from: alerts@halalchain.dev
  smtp_auth_username: apikey
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_pass

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: default
  group_by: [alertname, service, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 10s
      repeat_interval: 30m
      continue: true

    - matchers: [severity="critical", slo=~".*"]
      receiver: slo-critical
      repeat_interval: 15m

    - matchers: [severity="warning"]
      receiver: warning
      repeat_interval: 6h

    - matchers: [alertname=~"Tawheed_DeterminismViolation"]
      receiver: p0-incident
      repeat_interval: 5m
      group_wait: 0s
      continue: false

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service, cluster]

  - source_matchers: [alertname="Tawheed_ServiceDown"]
    target_matchers: [alertname=~"Tawheed_.*"]
    equal: [service]

  - source_matchers: [alertname="PlatformApi_DownstreamTawheedErrors"]
    target_matchers: [alertname="PlatformApi_ErrorBudgetBurn_Fast"]
    equal: [service]

receivers:
  - name: default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: critical
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: 'P0 {{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_key
        description: '{{ template "slack.title" . }}'
        severity: critical

  - name: slo-critical
    slack_configs:
      - channel: '#slo-burn'
        send_resolved: true

  - name: warning
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true

  - name: p0-incident
    slack_configs:
      - channel: '#incident-p0'
        title: 'P0: Determinism Violation'
        text: '{{ template "slack.text" . }}'
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_p0_key
        severity: critical