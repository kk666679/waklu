global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}
  smtp_smarthost: ${SMTP_HOST}:587
  smtp_from: alerts@halalchain.dev
  smtp_auth_username: ${SMTP_USER}
  smtp_auth_password: ${SMTP_PASS}

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: default
  group_by: [alertname, service, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 10s
      repeat_interval: 30m
      continue: true

    - matchers: [severity="critical", slo=~".*"]
      receiver: slo-critical
      repeat_interval: 15m

    - matchers: [severity="warning"]
      receiver: warning
      repeat_interval: 6h

    - matchers: [alertname=~"Tawheed_DeterminismViolation"]
      receiver: p0-incident
      repeat_interval: 5m
      group_wait: 0s
      continue: false

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service, cluster]

  - source_matchers: [alertname="Tawheed_ServiceDown"]
    target_matchers: [alertname=~"Tawheed_.*"]
    equal: [service]

  - source_matchers: [alertname="PlatformApi_DownstreamTawheedErrors"]
    target_matchers: [alertname="PlatformApi_ErrorBudgetBurn_Fast"]
    equal: [service]

receivers:
  - name: default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: critical
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: 'P0 {{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
    pagerduty_configs:
      - service_key: ${PAGERDUTY_KEY}
        description: '{{ template "slack.title" . }}'
        severity: critical

  - name: slo-critical
    slack_configs:
      - channel: '#slo-burn'
        send_resolved: true

  - name: warning
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true

  - name: p0-incident
    slack_configs:
      - channel: '#incident-p0'
        title: 'P0: Determinism Violation'
        text: '{{ template "slack.text" . }}'
    pagerduty_configs:
      - service_key: ${PAGERDUTY_P0_KEY}
        severity: critical