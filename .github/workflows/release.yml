name: HalalChain Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Publishing namespace for GHCR.
#
# This MUST be the account the push token belongs to. A workflow's
# GITHUB_TOKEN can only write packages under its own repository owner, so
# pushing to a different namespace fails at the registry with:
#   denied: permission_denied: The requested installation does not exist.
#
#   IMAGE_NAMESPACE unset -> repository owner, so the default GITHUB_TOKEN works.
#   IMAGE_NAMESPACE set   -> set the GHCR_TOKEN secret too (a PAT with the
#                            write:packages scope owned by that namespace).
#
# Override per-repository with a GHCR_NAMESPACE variable (Settings > Variables).
# GHCR namespaces are lowercase.
env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.GHCR_NAMESPACE || github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # The matrix must live on the job. `strategy` is not a valid step key: when
    # it was nested under the build step, GitHub rejected the whole workflow
    # file and every push failed this run in 0s with no jobs at all.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: halalchain-platform-api
            dockerfile: ./Dockerfile
            context: .
          - image: halalchain-web
            dockerfile: ./HalalChain.Web/Dockerfile
            context: .
          - image: halalchain-marketplace
            dockerfile: ./HalalChain.Marketplace/Dockerfile
            context: .
          # Both Python services build from the .halalchain/ context so the
          # _shared package and the pinned requirements/ locks are
          # reachable; their Dockerfiles copy from that layout. These two
          # were previously never published, yet values.yaml and
          # deploy-staging both reference them by SHA tag.
          - image: halalchain-ai-inference
            dockerfile: ./.halalchain/ai-inference/Dockerfile
            context: ./.halalchain
          - image: halalchain-tawheed
            dockerfile: ./.halalchain/tawheed/Dockerfile
            context: ./.halalchain
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # A PAT is only required when publishing to a namespace the default
          # GITHUB_TOKEN cannot write to. When it is absent, fall back to the
          # built-in token, which works for the repository-owner namespace.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign published images
        env:
          COSIGN_EXPERIMENTAL: "1"
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          for image in \
            halalchain-platform-api \
            halalchain-web \
            halalchain-marketplace \
            halalchain-ai-inference \
            halalchain-tawheed
          do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            cosign sign --yes "${REGISTRY}/${IMAGE_NAMESPACE}/${image}@${digest}"
          done

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint ./deploy/helm/halalchain

      - name: Helm package
        run: helm package ./deploy/helm/halalchain --destination ./dist

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - name: Deploy to staging
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          SHA: ${{ github.sha }}
        run: |
          helm upgrade --install halalchain ./deploy/helm/halalchain \
            --namespace halalchain-staging --create-namespace \
            --set image.registry="${REGISTRY}" \
            --set image.namespace="${IMAGE_NAMESPACE}" \
            --set platformApi.image.tag="${SHA}" \
            --set web.image.tag="${SHA}" \
            --set marketplace.image.tag="${SHA}" \
            --set aiInference.image.tag="${SHA}" \
            --set tawheed.image.tag="${SHA}" \
            --wait --timeout 5m

  smoke-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Health checks
        run: |
          check_endpoint() {
            local url=$1
            local attempts=5
            local interval=6
            for i in $(seq 1 $attempts); do
              if curl -fsS --max-time 30 "$url" > /dev/null 2>&1; then
                echo "PASS: $url"
                return 0
              fi
              echo "Attempt $i/$attempts failed for $url, retrying in ${interval}s..."
              sleep $interval
            done
            echo "FAIL: $url"
            return 1
          }

          STAGING_BASE="${{ vars.STAGING_BASE_URL }}"
          check_endpoint "${STAGING_BASE}:5001/health/ready" || exit 1
          check_endpoint "${STAGING_BASE}:5200/health/live" || exit 1
          check_endpoint "${STAGING_BASE}:5201/health/live" || exit 1

  deploy-production:
    needs: smoke-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - name: Deploy to production
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          SHA: ${{ github.sha }}
        run: |
          helm upgrade --install halalchain ./deploy/helm/halalchain \
            --namespace halalchain-production --create-namespace \
            --set image.registry="${REGISTRY}" \
            --set image.namespace="${IMAGE_NAMESPACE}" \
            --set platformApi.image.tag="${SHA}" \
            --set web.image.tag="${SHA}" \
            --set marketplace.image.tag="${SHA}" \
            --set aiInference.image.tag="${SHA}" \
            --set tawheed.image.tag="${SHA}" \
            --wait --timeout 5m
      - name: Record deployment metadata
        run: |
          REVISION=$(helm history halalchain -n halalchain-production --max 1 -o json | jq '.[0].revision')
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Helm revision:** ${REVISION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
