name: HalalChain Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/supporthalal/halalchain-platform-api:${{ github.sha }}
            ghcr.io/supporthalal/halalchain-platform-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HalalChain.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/supporthalal/halalchain-web:${{ github.sha }}
            ghcr.io/supporthalal/halalchain-web:latest

      - name: Build and push marketplace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HalalChain.Marketplace/Dockerfile
          push: true
          tags: |
            ghcr.io/supporthalal/halalchain-marketplace:${{ github.sha }}
            ghcr.io/supporthalal/halalchain-marketplace:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign published images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/supporthalal/halalchain-platform-api@$(docker buildx imagetools inspect ghcr.io/supporthalal/halalchain-platform-api:${{ github.sha }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes ghcr.io/supporthalal/halalchain-web@$(docker buildx imagetools inspect ghcr.io/supporthalal/halalchain-web:${{ github.sha }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes ghcr.io/supporthalal/halalchain-marketplace@$(docker buildx imagetools inspect ghcr.io/supporthalal/halalchain-marketplace:${{ github.sha }} --format '{{json .Manifest.Digest}}' | tr -d '"')

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./deploy/helm/halalchain

      - name: Helm package
        run: helm package ./deploy/helm/halalchain --destination ./dist

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Deploy to staging
        run: |
          helm upgrade --install halalchain ./deploy/helm/halalchain \
            --namespace halalchain-staging --create-namespace \
            --set platformApi.image.tag=${{ github.sha }} \
            --set web.image.tag=${{ github.sha }} \
            --set marketplace.image.tag=${{ github.sha }} \
            --set aiInference.image.tag=${{ github.sha }} \
            --set tawheed.image.tag=${{ github.sha }} \
            --wait --timeout 5m

  smoke-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Health checks
        run: |
          check_endpoint() {
            local url=$1
            local attempts=5
            local interval=6
            for i in $(seq 1 $attempts); do
              if curl -fsS --max-time 30 "$url" > /dev/null 2>&1; then
                echo "PASS: $url"
                return 0
              fi
              echo "Attempt $i/$attempts failed for $url, retrying in ${interval}s..."
              sleep $interval
            done
            echo "FAIL: $url"
            return 1
          }

          STAGING_BASE="${{ vars.STAGING_BASE_URL }}"
          check_endpoint "${STAGING_BASE}:5001/health/ready" || exit 1
          check_endpoint "${STAGING_BASE}:5200/health/live" || exit 1
          check_endpoint "${STAGING_BASE}:5201/health/live" || exit 1

  deploy-production:
    needs: smoke-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Deploy to production
        run: |
          helm upgrade --install halalchain ./deploy/helm/halalchain \
            --namespace halalchain-production --create-namespace \
            --set platformApi.image.tag=${{ github.sha }} \
            --set web.image.tag=${{ github.sha }} \
            --set marketplace.image.tag=${{ github.sha }} \
            --set aiInference.image.tag=${{ github.sha }} \
            --set tawheed.image.tag=${{ github.sha }} \
            --wait --timeout 5m
      - name: Record deployment metadata
        run: |
          REVISION=$(helm history halalchain -n halalchain-production --max 1 -o json | jq '.[0].revision')
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Helm revision:** ${REVISION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
