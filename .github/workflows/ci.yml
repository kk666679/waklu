name: HalalChain CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  SOLUTION: 'HalalChain.Platform.sln'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm workspace deps (includes Sass)
        run: npm install --no-audit --no-fund

      - name: Compile SCSS
        run: npm run scss:build

      - name: Validate docs and service inventory
        run: python3 infrastructure/scripts/check-docs.py

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build -c Release --verbosity normal

  python-tests:
    name: Python Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-inference, tawheed, local-models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # requirements.txt and ../requirements-test.txt are thin -r includes into
      # .halalchain/requirements/*.txt; the lock itself carries halalchain-shared's
      # dependencies, and the package itself is installed separately because pip
      # cannot hash-check a local requirement.
      - name: Install ${{ matrix.service }} dependencies
        working-directory: .halalchain/${{ matrix.service }}
        run: |
          if [[ "${{ matrix.service }}" == "local-models" ]]; then
            pip install --disable-pip-version-check -r ../requirements/base.txt
          else
            pip install --disable-pip-version-check -r requirements.txt
          fi
          pip install --disable-pip-version-check -r ../requirements-test.txt
          pip install --disable-pip-version-check ../_shared
      # Fails loudly instead of the way a comment-only requirements file failed
      # before: a no-op install used to surface much later as a confusing
      # "pytest: command not found". These imports are exactly what
      # src/observability.py and src/main.py need at module scope.
      - name: Verify the runtime and test dependencies are importable
        working-directory: .halalchain/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python -c "import pytest, fastapi; print('base dependencies importable')"
          if [[ "$SERVICE" != "local-models" ]]; then
            python -c "import prometheus_client; \
              from opentelemetry.sdk.trace import TracerProvider; \
              from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter; \
              print('observability dependencies importable')"
          fi
      - name: Run pytest
        working-directory: .halalchain/${{ matrix.service }}
        run: python -m pytest

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Check vulnerable dependencies
        run: dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Platform API image
        run: docker build -t halalchain/platform-api:${{ github.sha }} .
      - name: Build full stack
        run: docker compose build
