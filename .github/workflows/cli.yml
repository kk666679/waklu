name: CLI

on:
  pull_request:
    paths:
      - "HalalChain-Cli/**"
      - "package.json"
      - "package-lock.json"

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This repository is an npm workspace (root package.json declares
      # `workspaces` and package-lock.json is committed). The workflow
      # previously installed with pnpm against pnpm-workspace.yaml and
      # pnpm-lock.yaml — neither of which exists — so `pnpm install
      # --frozen-lockfile` failed before any gate could run.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --workspace HalalChain-Cli

      - name: Validate skills
        working-directory: HalalChain-Cli
        run: npm run intent:validate

      - name: Test
        run: npm test --workspace HalalChain-Cli

      - name: Guard — no browser packages
        working-directory: HalalChain-Cli
        run: |
          node -e "
            const pkg = require('./package.json');
            const banned = ['@tanstack/ai-react','@tanstack/react-query','@tanstack/react-devtools','@tanstack/react-ai-devtools'];
            const found = banned.filter(p => pkg.dependencies?.[p] || pkg.devDependencies?.[p]);
            if (found.length) { console.error('Browser-only packages in a CLI:', found); process.exit(1); }
            console.log('OK: no browser-only packages');
          "

      - name: Guard — MCP client not closed in chat.ts
        working-directory: HalalChain-Cli
        run: |
          if grep -q "closeMCPClient" src/runtime/chat.ts; then
            echo "chat.ts must not call closeMCPClient(). See src/lib/mcp-client.ts."
            exit 1
          fi
          echo "OK: chat.ts does not close the MCP client"
