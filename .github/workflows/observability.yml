name: Observability Stack

on:
  push:
    paths:
      - 'infrastructure/otel/**'
      - 'infrastructure/prometheus/**'
      - 'infrastructure/grafana/**'
      - 'infrastructure/alertmanager/**'
      - 'infrastructure/tempo/**'
      - 'infrastructure/loki/**'
      - 'docs/runbooks/**'
      - 'docs/slo.yaml'
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'docs/runbooks/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AlertManager config
        env:
          SLACK_WEBHOOK_URL: https://example.invalid/
        run: |
          envsubst '${SLACK_WEBHOOK_URL}' \
            < infrastructure/alertmanager/alertmanager.yml \
            > "$RUNNER_TEMP/alertmanager.yml"
          chmod 644 "$RUNNER_TEMP/alertmanager.yml"
          docker run --rm \
            -v "$RUNNER_TEMP/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$PWD/infrastructure/alertmanager/templates:/etc/alertmanager/templates:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

      # Alertmanager never expands ${VAR} in its config, so secrets are read
      # from files under infrastructure/alertmanager/secrets/ (gitignored, so
      # absent in CI). This only asserts the wiring is consistent: every
      # *_file path in the config has a matching entry in the writer script.
      # A missing secrets directory is expected here and is not an error.
      - name: Verify AlertManager secret wiring
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("infrastructure")
          config = (root / "alertmanager" / "alertmanager.yml").read_text(encoding="utf-8")
          script = (root / "scripts" / "write-alertmanager-secrets.py").read_text(encoding="utf-8")

          referenced = set(re.findall(r"_file:\s*(\S+)", config))
          written = set(re.findall(r'^\s{4}"([a-z0-9_]+)":', script, re.MULTILINE))

          expected = {f"/etc/alertmanager/secrets/{name}" for name in written}
          missing = referenced - expected
          if missing:
              print("Config references secret files the writer never creates:")
              for path in sorted(missing):
                  print(f" - {path}")
              sys.exit(1)
          print(f"AlertManager secret wiring OK: {len(referenced)} file reference(s).")
          PY
