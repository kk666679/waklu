name: Observability Stack

on:
  push:
    paths:
      - 'infrastructure/otel/**'
      - 'infrastructure/prometheus/**'
      - 'infrastructure/grafana/**'
      - 'infrastructure/alertmanager/**'
      - 'infrastructure/tempo/**'
      - 'infrastructure/loki/**'
      - 'docs/runbooks/**'
      - 'docs/slo.yaml'
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'docs/runbooks/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AlertManager config
        env:
          SLACK_WEBHOOK_URL: https://example.invalid/
        run: |
          envsubst '${SLACK_WEBHOOK_URL}' \
            < infrastructure/alertmanager/alertmanager.yml \
            > "$RUNNER_TEMP/alertmanager.yml"
          chmod 644 "$RUNNER_TEMP/alertmanager.yml"
          docker run --rm \
            -v "$RUNNER_TEMP/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$PWD/infrastructure/alertmanager/templates:/etc/alertmanager/templates:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml
