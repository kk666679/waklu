name: Verify Python Locks

on:
  push:
    branches: [main]
    paths:
      - '.halalchain/**/pyproject.toml'
      - '.halalchain/requirements/*.txt'
  pull_request:
    paths:
      - '.halalchain/**/pyproject.toml'
      - '.halalchain/requirements/*.txt'

jobs:
  verify-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify shared base lock
        run: |
          uv pip compile .halalchain/_shared/pyproject.toml --extra base --generate-hashes \
            -o /tmp/base.expected
          diff -u .halalchain/requirements/base.txt /tmp/base.expected \
            || (echo "base.txt is stale. Regenerate with: uv pip compile .halalchain/_shared/pyproject.toml --extra base --generate-hashes -o .halalchain/requirements/base.txt" && exit 1)

      - name: Verify shared skills lock
        run: |
          uv pip compile .halalchain/_shared/pyproject.toml --extra skills --generate-hashes \
            -o /tmp/skills.expected
          diff -u .halalchain/requirements/skills.txt /tmp/skills.expected \
            || (echo "skills.txt is stale. Regenerate with: uv pip compile .halalchain/_shared/pyproject.toml --extra skills --generate-hashes -o .halalchain/requirements/skills.txt" && exit 1)

      - name: Verify shared mcp lock
        run: |
          uv pip compile .halalchain/_shared/pyproject.toml --extra mcp --generate-hashes \
            -o /tmp/mcp.expected
          diff -u .halalchain/requirements/mcp.txt /tmp/mcp.expected \
            || (echo "mcp.txt is stale. Regenerate with: uv pip compile .halalchain/_shared/pyproject.toml --extra mcp --generate-hashes -o .halalchain/requirements/mcp.txt" && exit 1)

      - name: Verify ai-inference llm lock
        run: |
          uv pip compile .halalchain/ai-inference/pyproject.toml --extra llm --generate-hashes \
            -o /tmp/llm.expected
          diff -u .halalchain/requirements/llm.txt /tmp/llm.expected \
            || (echo "llm.txt is stale. Regenerate with: uv pip compile .halalchain/ai-inference/pyproject.toml --extra llm --generate-hashes -o .halalchain/requirements/llm.txt" && exit 1)

      - name: Verify ai-inference vector lock
        run: |
          uv pip compile .halalchain/ai-inference/pyproject.toml --extra vector --generate-hashes \
            -o /tmp/vector.expected
          diff -u .halalchain/requirements/vector.txt /tmp/vector.expected \
            || (echo "vector.txt is stale. Regenerate with: uv pip compile .halalchain/ai-inference/pyproject.toml --extra vector --generate-hashes -o .halalchain/requirements/vector.txt" && exit 1)

      - name: Verify ai-inference service lock
        run: |
          uv pip compile .halalchain/ai-inference/pyproject.toml --extra llm --extra vector --extra doc-processing --extra auth --extra observability --generate-hashes \
            -o /tmp/ai-inference.expected
          diff -u .halalchain/requirements/ai-inference.txt /tmp/ai-inference.expected \
            || (echo "ai-inference.txt is stale. Regenerate with: uv pip compile .halalchain/ai-inference/pyproject.toml --extra llm --extra vector --extra doc-processing --extra auth --extra observability --generate-hashes -o .halalchain/requirements/ai-inference.txt" && exit 1)

      - name: Verify tawheed service lock
        run: |
          uv pip compile .halalchain/tawheed/pyproject.toml --generate-hashes \
            -o /tmp/tawheed.expected
          diff -u .halalchain/requirements/tawheed.txt /tmp/tawheed.expected \
            || (echo "tawheed.txt is stale. Regenerate with: uv pip compile .halalchain/tawheed/pyproject.toml --generate-hashes -o .halalchain/requirements/tawheed.txt" && exit 1)

      - name: Verify dev lock
        run: |
          uv pip compile .halalchain/_shared/pyproject.toml --extra dev --generate-hashes \
            -o /tmp/dev.expected
          diff -u .halalchain/requirements/dev.txt /tmp/dev.expected \
            || (echo "dev.txt is stale. Regenerate with: uv pip compile .halalchain/_shared/pyproject.toml --extra dev --generate-hashes -o .halalchain/requirements/dev.txt" && exit 1)

      - name: Verify local-models inference lock
        run: |
          uv pip compile .halalchain/local-models/pyproject.toml --extra inference --generate-hashes \
            -o /tmp/local-models.expected
          diff -u .halalchain/requirements/local-models.txt /tmp/local-models.expected \
            || (echo "local-models.txt is stale. Regenerate with: uv pip compile .halalchain/local-models/pyproject.toml --extra inference --generate-hashes -o .halalchain/requirements/local-models.txt" && exit 1)

      - name: Verify local-models quantization lock
        run: |
          uv pip compile .halalchain/local-models/pyproject.toml --extra quantization --generate-hashes \
            -o /tmp/local-models-quantization.expected
          diff -u .halalchain/requirements/local-models-quantization.txt /tmp/local-models-quantization.expected \
            || (echo "local-models-quantization.txt is stale. Regenerate with: uv pip compile .halalchain/local-models/pyproject.toml --extra quantization --generate-hashes -o .halalchain/requirements/local-models-quantization.txt" && exit 1)

      - name: Verify local-models gguf lock
        run: |
          uv pip compile .halalchain/local-models/pyproject.toml --extra gguf --generate-hashes \
            -o /tmp/local-models-gguf.expected
          diff -u .halalchain/requirements/local-models-gguf.txt /tmp/local-models-gguf.expected \
            || (echo "local-models-gguf.txt is stale. Regenerate with: uv pip compile .halalchain/local-models/pyproject.toml --extra gguf --generate-hashes -o .halalchain/requirements/local-models-gguf.txt" && exit 1)

      - name: Verify local-models optimized lock
        run: |
          uv pip compile .halalchain/local-models/pyproject.toml --extra optimized --generate-hashes \
            -o /tmp/local-models-optimized.expected
          diff -u .halalchain/requirements/local-models-optimized.txt /tmp/local-models-optimized.expected \
            || (echo "local-models-optimized.txt is stale. Regenerate with: uv pip compile .halalchain/local-models/pyproject.toml --extra optimized --generate-hashes -o .halalchain/requirements/local-models-optimized.txt" && exit 1)